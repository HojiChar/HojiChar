name: CI wowkflow

on:
  push:
    branches:
      - main    
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      # Fugashi does not yet publish Python 3.15 wheels.
      - name: Install MeCab for Python 3.15 (Linux)
        if: matrix.python-version == '3.15' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmecab-dev
      - name: Install MeCab for Python 3.15 (macOS)
        if: matrix.python-version == '3.15' && runner.os == 'macOS'
        run: brew install mecab
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Test with pytest and doctest
        run: |
          if [ '${{ matrix.python-version }}' == '3.12' ] && [ '${{ matrix.os }}' == 'ubuntu-latest' ]; then
            uv run pytest --cov -v --doctest-modules -m "download_test"
          else
            uv run pytest --cov -v --doctest-modules -m "not download_test"
          fi
      - name: Upload coverge reports to Codecov via GitHub Actions
        uses: codecov/codecov-action@v7

  lint_check:
    runs-on: ubuntu-latest
    env:
      python-version: "3.11"

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ env.python-version }}
      - name: Check black and isort
        run: |
          uvx ruff check --diff .

  mypy_check:
    runs-on: ubuntu-latest
    env:
      python-version: "3.11"

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ env.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Mypy type checking
        run: uv run mypy --explicit-package-bases hojichar
